<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram Home Refresh</title>
  <style>
    :root {
      --bg: #121212;
      --card-bg: #1e1e1e;
      --text-main: #f5f5f5;
      --text-muted: #a0a0a0;
      --accent: linear-gradient(90deg, #feda75, #fa7e1e, #d62976, #962fbf, #4f5bd5);
      --border: #2a2a2a;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      width: 310px;
      background-color: var(--bg);
      color: var(--text-main);
      padding: 16px;
      font-size: 13px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    .logo {
      width: 32px;
      height: 32px;
      border-radius: 8px;
    }
    .title-group h1 {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.2px;
    }
    .badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      padding: 1px 6px;
      border-radius: 10px;
      background: rgba(46, 204, 113, 0.15);
      color: #2ecc71;
      margin-top: 2px;
    }
    .card {
      background: var(--card-bg);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px;
      border: 1px solid var(--border);
    }
    .card-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 8px;
      font-weight: 700;
    }
    .feature-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .feature-item {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 12px;
      line-height: 1.3;
    }
    .feature-icon {
      font-size: 14px;
      width: 20px;
      text-align: center;
      flex-shrink: 0;
    }
    .kbd {
      background: #2b2b2b;
      border: 1px solid #444;
      border-radius: 4px;
      padding: 1px 5px;
      font-family: monospace;
      font-size: 11px;
      font-weight: 600;
      color: #fff;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 9px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      border: none;
      transition: opacity 0.15s ease, transform 0.1s ease;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .btn-primary {
      background: var(--accent);
      color: #fff;
      margin-bottom: 8px;
    }
    .btn-secondary {
      background: #222;
      color: #ddd;
      border: 1px solid var(--border);
    }
    .btn-secondary:hover {
      background: #2a2a2a;
      color: #fff;
    }
    .footer {
      text-align: center;
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="icons/icon48.png" alt="Logo" class="logo">
    <div class="title-group">
      <h1>Instagram Refresh</h1>
      <span class="badge">● Active & Ready</span>
    </div>
  </div>

  <div class="card">
    <div class="card-title">How To Refresh</div>
    <ul class="feature-list">
      <li class="feature-item">
        <span class="feature-icon">🖱️</span>
        <span>Click active icon (<strong>Home, Reels, Explore</strong>)</span>
      </li>
      <li class="feature-item">
        <span class="feature-icon">⌨️</span>
        <span>Press <span class="kbd">R</span> or <span class="kbd">.</span> anywhere</span>
      </li>
      <li class="feature-item">
        <span class="feature-icon">📱</span>
        <span>Pull down at top (mouse or trackpad)</span>
      </li>
    </ul>
  </div>

  <button id="open-ig-btn" class="btn btn-primary">Open Instagram</button>
  <button id="rate-btn" class="btn btn-secondary">⭐ Rate on Chrome Web Store</button>

  <div class="footer">
    Single Purpose • 100% Private • No Tracking
  </div>

  <script src="popup.js"></script>
</body>
</html>
